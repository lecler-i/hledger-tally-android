name: Android CI

on:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TALLY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::TALLY_KEYSTORE_BASE64 is not set, signing with a throwaway debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tally.p12"
          echo "TALLY_KEYSTORE=$RUNNER_TEMP/tally.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          TALLY_KEYSTORE_PASSWORD: ${{ secrets.TALLY_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # main: one release per versionName. Other branches: one prerelease per branch,
      # recreated on each push so its tag follows the latest commit.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: app/build/outputs/apk/release/app-release.apk
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            TAG="v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "$TAG is already released, bump versionName to publish a new one"
            else
              gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TAG"
            fi
          else
            TAG="dev-$(printf %s "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9' '-')"
            gh release delete "$TAG" --cleanup-tag --yes 2> /dev/null || true
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease \
              --title "Dev build: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          fi
