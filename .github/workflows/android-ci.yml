name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK platform & build-tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      # Releases are only published on pushes (not pull_request runs) — PRs from
      # forks don't get write access to GITHUB_TOKEN by default, so this step
      # would just fail there for no benefit; the artifact upload above already
      # covers "did it build" validation for PRs.
      - name: Determine release tag
        if: github.event_name == 'push'
        id: release_tag
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "name=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-')
            echo "tag=dev-$SLUG" >> "$GITHUB_OUTPUT"
            echo "name=Dev build: ${{ github.ref_name }} @ ${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          files: app/build/outputs/apk/release/*.apk
